name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]

# One deploy at a time: concurrent runs pile docker builds onto a 1GB box
# and ALL of them time out (seen 4x on 2026-09-10). Newer runs preempt stale
# queued ones; the survivor always deploys the latest main.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: BUILD_TARGET=export bun run build:ui
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: gateway
      - name: Deploy gateway worker
        working-directory: gateway
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # default is 10m - a cold api+db+ai+realtime rebuild on a swap-backed
          # t3.micro takes well over 40m (api go build alone ran 27m on
          # 2026-09-10). 120m fits inside the runner's 6h job cap.
          command_timeout: 120m
          script: |
            set -e
            cd ~/sih-thermal || cd ~/app
            git pull --ff-only
            docker compose --parallel 1 -f compose.prod.yaml build
            docker compose -f compose.prod.yaml up -d
            docker image prune -f