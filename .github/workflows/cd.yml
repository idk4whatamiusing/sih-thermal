name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: BUILD_TARGET=export bun run build:ui
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: gateway
      - name: Deploy gateway worker
        working-directory: gateway
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # default is 10m - too short for a from-scratch Rust release build
          # on a t3.micro, especially now that it's swap-backed (slower I/O)
          command_timeout: 40m
          script: |
            set -e
            cd ~/sih-thermal || cd ~/app
            git pull --ff-only
            docker compose --parallel 1 -f compose.prod.yaml build
            docker compose -f compose.prod.yaml up -d
            docker image prune -f