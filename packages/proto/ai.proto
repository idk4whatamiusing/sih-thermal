syntax = "proto3";

package meridian.ai.v1;

option go_package = "github.com/idk4whatamiusing/meridian_stack/api/pb/aipb";

// Ai owns ALL AI work: RAG (Python), LLM providers - Cloudflare Workers AI /
// Bedrock (Go), and the local knowledge-base-only support LLM.
service Ai {
  // general chat: provider-aware, RAG-augmented
  rpc Chat(ChatRequest) returns (ChatReply);
  rpc ChatStream(ChatRequest) returns (stream ChatChunk);

  // support: knowledge-base-only, local TinyLlama Q4 via llama.cpp
  rpc SupportQuery(SupportQueryRequest) returns (stream SupportChunk);
  rpc Ingest(IngestRequest) returns (IngestReply);

  // baseline classifier (kept from the original template)
  rpc Predict(PredictRequest) returns (PredictReply);

  // PS162: FIRMS thermal point classification, proxied to the Python sidecar
  rpc ClassifyFirmsPoint(ClassifyFirmsPointRequest) returns (ClassifyFirmsPointReply);
  rpc ClusterFirmsPoints(ClusterFirmsPointsRequest) returns (ClusterFirmsPointsReply);
  rpc IngestFirms(IngestFirmsRequest) returns (IngestFirmsReply);
}

message ChatRequest {
  string message = 1;
  string system = 2;
  bool use_rag = 3;
  string user_id = 4;   // per-user semantic cache isolation
  string session_id = 5;
  string provider = 6;  // cloudflare | bedrock | openai ("" = AI_PROVIDER default)
}

message Source {
  string id = 1;
  string title = 2;
  string text = 3;
  float score = 4;
}

message ChatReply {
  string reply = 1;
  string model = 2;
  repeated Source sources = 3;
  bool cached = 4;
}

message ChatChunk {
  string delta = 1;
  bool done = 2;
  repeated Source sources = 3; // set on first chunk (RAG runs before streaming)
  bool cached = 4;
}

message SupportQueryRequest {
  string message = 1;
  string user_id = 2;
}

message SupportChunk {
  string delta = 1;
  bool done = 2;
  repeated Source sources = 3;
  bool cached = 4;
}

message IngestRequest {
  repeated string documents = 1;      // raw text documents to chunk+embed
  string collection = 2;              // "support" | "chat"
}
message IngestReply {
  int32 chunks = 1;
}

message PredictRequest {
  string text = 1;
}
message PredictReply {
  string label = 1;
}

// --- PS162: FIRMS ---

message ClassifyFirmsPointRequest {
  double lat = 1;
  double lon = 2;
  double frp = 3;
  double bright_ti4 = 4;
  double bright_ti5 = 5;
  string confidence = 6;
  string satellite = 7;
  // enrichment hints - unset means "not supplied by caller, let the ai
  // service look it up via db.NearestIndustrialSite (PostGIS)"; explicit
  // presence (proto3 optional) so a real 0m/false isn't confused with unset
  optional double dist_industrial_m = 8;
  optional bool inside_industrial = 9;
  double persistence = 10;   // 0..1
  optional int32 landcover = 11; // unset -> Python sidecar auto-samples from ESA WorldCover
}
message ClassifyFirmsPointReply {
  string predicted_class = 1;
  double industrial_prob = 2;
  double persistence = 3;
  repeated string reasons = 4;
  optional int32 landcover = 5; // value actually used (supplied or auto-sampled)
  // similar past cases from the RAG store (Phase 3a), populated on every
  // call, not just ambiguous ones - reuses the Source message from chat.
  repeated Source similar_cases = 6;
}

message FirmsClusterPointIn {
  double lat = 1;
  double lon = 2;
  double frp = 3;
}
message ClusterFirmsPointsRequest {
  repeated FirmsClusterPointIn points = 1;
  double eps_m = 2;         // 0 = server default (1000)
  int32 min_samples = 3;    // 0 = server default (3)
  int32 window_days = 4;    // 0 = server default (30)
}
message FirmsClusterPointOut {
  double lat = 1;
  double lon = 2;
  int32 cluster = 3;        // -1 = noise, unclustered
  double persistence = 4;
}
message ClusterFirmsPointsReply {
  repeated FirmsClusterPointOut clusters = 1;
  int32 n_clusters = 2;
}

message IngestFirmsRequest {
  double min_lat = 1;
  double min_lon = 2;
  double max_lat = 3;
  double max_lon = 4;
  string date_from = 5;
  string date_to = 6;
  // FIRMS product source, e.g. VIIRS_SNPP_NRT (default) | VIIRS_NOAA20_NRT |
  // VIIRS_NOAA21_NRT | MODIS_NRT. "" = server default (SNPP). Added for the
  // world 1yr+ backfill (issue #20) so each sensor is ingested separately;
  // firmsPointID already includes satellite so cross-sensor upserts stay idempotent.
  string source = 7;
}
message IngestFirmsReply {
  bool ok = 1;
  string error = 2;
  int32 points_ingested = 3; // count of raw points fetched, enriched, classified and persisted
}
